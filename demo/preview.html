<!DOCTYPE html>
<html lang="zh-CN" data-ydm-preview="true">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="require-trusted-types-for 'script'">
  <title>YouTube Danmaku preview</title>
  <style>
    body {
      margin: 0;
      background: #0f0f0f;
      color: #f1f1f1;
      font-family: Roboto, Arial, sans-serif;
    }
    .layout {
      display: flex;
      gap: 16px;
      padding: 68px 16px 16px;
      align-items: flex-start;
    }
    .page-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 56px;
      z-index: 2000;
      background: #0f0f0f;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    #movie_player {
      position: relative;
      width: 640px;
      height: 360px;
      background: #000;
      overflow: hidden;
    }
    .html5-video-container {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    .ydm-demo-stage {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      background: #0f0f0f;
      pointer-events: none;
    }
    .ydm-demo-stage__bg,
    .ydm-demo-stage__glow,
    .ydm-demo-stage__sheen {
      position: absolute;
      inset: -40%;
      will-change: transform, background-position, opacity;
    }
    .ydm-demo-stage__bg {
      background: linear-gradient(
        120deg,
        #0f0f0f 0%,
        #5c0000 16%,
        #ff0000 30%,
        #3d0000 46%,
        #0f0f0f 58%,
        #cc0000 74%,
        #0f0f0f 100%
      );
      background-size: 320% 320%;
      animation: ydm-demo-bg-shift 7s ease-in-out infinite;
    }
    .ydm-demo-stage__glow {
      background:
        radial-gradient(circle at 18% 28%, rgba(255, 0, 0, 0.65), transparent 42%),
        radial-gradient(circle at 82% 72%, rgba(255, 109, 109, 0.45), transparent 40%),
        radial-gradient(circle at 52% 12%, rgba(204, 0, 0, 0.4), transparent 38%);
      mix-blend-mode: screen;
      animation: ydm-demo-glow-drift 9s ease-in-out infinite;
    }
    .ydm-demo-stage__sheen {
      inset: -60%;
      background: linear-gradient(
        105deg,
        transparent 35%,
        rgba(255, 255, 255, 0.07) 48%,
        rgba(255, 120, 120, 0.2) 52%,
        transparent 65%
      );
      background-size: 220% 100%;
      animation: ydm-demo-sheen-sweep 5.5s linear infinite;
      opacity: 0.9;
    }
    .ydm-demo-stage__label {
      position: absolute;
      left: 24px;
      bottom: 56px;
      z-index: 2;
      color: #aaa;
      font-size: 14px;
      line-height: 1.4;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.85);
      pointer-events: none;
    }
    .ydm-demo-stage__title {
      display: block;
      margin-bottom: 4px;
      color: #fff;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    @keyframes ydm-demo-bg-shift {
      0% { background-position: 0% 50%; transform: scale(1.05) rotate(0deg); }
      33% { background-position: 50% 100%; transform: scale(1.12) rotate(2deg); }
      66% { background-position: 100% 0%; transform: scale(1.08) rotate(-2deg); }
      100% { background-position: 0% 50%; transform: scale(1.05) rotate(0deg); }
    }
    @keyframes ydm-demo-glow-drift {
      0% { transform: translate(-12%, -8%) scale(1) rotate(0deg); }
      50% { transform: translate(14%, 10%) scale(1.15) rotate(12deg); }
      100% { transform: translate(-12%, -8%) scale(1) rotate(0deg); }
    }
    @keyframes ydm-demo-sheen-sweep {
      0% { background-position: -120% 0; transform: translateX(-8%); }
      100% { background-position: 220% 0; transform: translateX(8%); }
    }
    video {
      width: 100%;
      height: 100%;
      background: transparent;
      object-fit: cover;
      opacity: 0;
      pointer-events: none;
    }
    .ytp-chrome-bottom {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 48px;
      z-index: 40;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.75));
    }
    .ytp-right-controls {
      position: absolute;
      right: 0;
      top: 0;
      height: 48px;
      display: flex;
      align-items: center;
    }
    ytd-live-chat-frame {
      width: 320px;
      height: 596px;
      background: #181818;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #chat-messages {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    yt-live-chat-header-renderer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      min-height: 48px;
      padding: 0 8px;
      border-bottom: 1px solid #303030;
      flex-shrink: 0;
    }
    #close-button {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: #aaa;
      cursor: pointer;
    }
    #items {
      flex: 1;
      overflow: auto;
      padding: 8px;
      font-size: 13px;
    }
    #items yt-live-chat-text-message-renderer,
    #items yt-live-chat-paid-message-renderer {
      display: block;
      margin: 6px 0;
    }
    yt-live-chat-paid-message-renderer {
      border-radius: 8px;
      overflow: hidden;
    }
    yt-live-chat-paid-message-renderer #header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      background: #d32f2f;
      color: #fff;
    }
    yt-live-chat-paid-message-renderer #content {
      padding: 6px 8px 8px;
      background: #b71c1c;
      color: #fff;
    }
    yt-live-chat-paid-message-renderer #author-photo img {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: block;
    }
    #author-name { font-weight: 600; margin-right: 6px; }
    #purchase-amount { font-weight: 700; margin-left: auto; }
    .chat-input-wrap {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      padding: 8px;
      border-top: 1px solid #303030;
      box-sizing: border-box;
    }
    #input {
      flex: 1;
      min-width: 0;
      min-height: 40px;
      border: 1px solid #3f3f3f;
      border-radius: 8px;
      padding: 8px 10px;
      box-sizing: border-box;
      background: #121212;
      color: #f1f1f1;
      outline: none;
    }
    #picker-buttons {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      flex-shrink: 0;
      min-height: 40px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 8px 8px;
    }
    .toolbar button {
      background: #ff0000;
      color: #fff;
      border: none;
      border-radius: 18px;
      padding: 8px 12px;
      cursor: pointer;
      font-weight: 600;
    }
    .toolbar button.secondary {
      background: #3f3f3f;
    }
  </style>
</head>
<body>
  <div class="page-header"></div>
  <div class="layout">
    <ytd-watch-flexy class="ytd-page-manager">
      <div id="movie_player" class="html5-video-player">
        <div class="html5-video-container">
          <div class="ydm-demo-stage" aria-hidden="true">
            <div class="ydm-demo-stage__bg"></div>
            <div class="ydm-demo-stage__glow"></div>
            <div class="ydm-demo-stage__sheen"></div>
            <div class="ydm-demo-stage__label">
              <span class="ydm-demo-stage__title">YouTube Danmaku</span>
              Demo preview
            </div>
          </div>
          <video class="video-stream html5-main-video"></video>
        </div>
        <div class="ytp-chrome-bottom">
          <div class="ytp-right-controls"></div>
        </div>
      </div>
    </ytd-watch-flexy>
    <ytd-live-chat-frame id="chat">
      <div id="chat-messages">
        <yt-live-chat-header-renderer>
          <button id="close-button" type="button" aria-label="Close" title="Close">×</button>
        </yt-live-chat-header-renderer>
        <div id="items" class="yt-live-chat-item-list-renderer">
          <yt-live-chat-text-message-renderer id="history-1">
            <span id="author-name" style="color:#aaaaaa">History</span>
            <span id="message">already on screen</span>
          </yt-live-chat-text-message-renderer>
        </div>
      </div>
      <div class="chat-input-wrap">
        <div id="input" class="yt-live-chat-text-input-field-renderer" contenteditable="true"></div>
        <div id="picker-buttons"></div>
      </div>
      <div class="toolbar">
        <button id="add-chat" type="button">Add chat</button>
        <button id="add-superchat" class="secondary" type="button">Add Super Chat</button>
      </div>
    </ytd-live-chat-frame>
  </div>
  <script>
    function GM_addStyle(css) {
      const style = document.createElement('style');
      style.textContent = css;
      document.documentElement.appendChild(style);
    }
    function GM_getValue(key, fallback) {
      try {
        const raw = localStorage.getItem('ydm-preview:' + key);
        return raw == null ? fallback : JSON.parse(raw);
      } catch (_) {
        return fallback;
      }
    }
    function GM_setValue(key, value) {
      localStorage.setItem('ydm-preview:' + key, JSON.stringify(value));
    }
    function GM_xmlhttpRequest(details) {
      if (details && typeof details.onerror === 'function') details.onerror({});
    }
    function GM_setClipboard(text) {
      if (navigator.clipboard) return navigator.clipboard.writeText(text);
    }
  </script>
  <script src="../dist/youtube-danmaku.user.js?v=170"></script>
  <script>
    const samples = [
      ['Alice', '#ff8a80', 'hello from chat'],
      ['小明', '#ffd600', '这是一条中文弹幕'],
      ['Bob', '#82b1ff', 'lol lol lol lol lol'],
      ['重复', '#ea80fc', '我不知道我不知道我不知道我不知道我不知道'],
      ['数字', '#b9f6ca', '666'],
      ['表情', '#ffab91', '😂😂😂'],
      ['长句', '#80d8ff', '这是一条比较长的弹幕，用来试听变速模式会不会在超过单条最长朗读时间之后自动加快语速。'],
    ];
    const scSamples = [
      ['SuperFan', '$5.00', '#e53935', 'thanks for the stream'],
      ['PatronLongNameHere', '¥200', '#f9a825', '老板大气！希望下次还能看到这么有趣的直播内容，继续加油。'],
      ['Gift', '$2.00', '#1e88e5', 'hello'],
      ['NightOwl', '$10.00', '#8e24aa', 'This is a longer Super Chat so the pinned pill should scroll the message while avatar and amount stay fixed.'],
    ];
    const avatarUrl = 'https://yt3.ggpht.com/a/default-user=s48-c-k-c0x00ffffff-no-rj';
    let seq = 0;

    function addMessage(name, color, text) {
      const item = document.createElement('yt-live-chat-text-message-renderer');
      item.id = 'live-' + (++seq);
      const author = document.createElement('span');
      author.id = 'author-name';
      author.style.color = color;
      author.textContent = name;
      const link = document.createElement('a');
      link.href = 'https://www.youtube.com/@' + encodeURIComponent(name);
      link.appendChild(author);
      const message = document.createElement('span');
      message.id = 'message';
      message.textContent = text;
      item.append(link, message);
      document.getElementById('items').appendChild(item);
    }

    function addSuperchat(name, amount, color, text) {
      const item = document.createElement('yt-live-chat-paid-message-renderer');
      item.id = 'live-sc-' + (++seq);
      const header = document.createElement('div');
      header.id = 'header';
      header.style.background = color;
      header.style.color = '#fff';
      const photo = document.createElement('yt-img-shadow');
      photo.id = 'author-photo';
      const img = document.createElement('img');
      img.src = avatarUrl;
      img.alt = '';
      photo.appendChild(img);
      const author = document.createElement('span');
      author.id = 'author-name';
      author.textContent = name;
      const purchase = document.createElement('span');
      purchase.id = 'purchase-amount';
      purchase.textContent = amount;
      header.append(photo, author, purchase);
      const content = document.createElement('div');
      content.id = 'content';
      content.style.background = color;
      content.style.color = '#fff';
      const message = document.createElement('span');
      message.id = 'message';
      message.textContent = text;
      content.appendChild(message);
      item.append(header, content);
      document.getElementById('items').appendChild(item);
    }

    document.getElementById('add-chat').addEventListener('click', () => {
      const sample = samples[seq % samples.length];
      addMessage(sample[0], sample[1], sample[2] + ' ' + (seq + 1));
    });

    document.getElementById('add-superchat').addEventListener('click', () => {
      const sample = scSamples[seq % scSamples.length];
      addSuperchat(sample[0], sample[1], sample[2], sample[3] + ' #' + (seq + 1));
    });

    setTimeout(() => {
      samples.forEach((sample, index) => {
        setTimeout(() => addMessage(sample[0], sample[1], sample[2]), index * 700);
      });
      scSamples.forEach((sample, index) => {
        setTimeout(
          () => addSuperchat(sample[0], sample[1], sample[2], sample[3]),
          samples.length * 700 + index * 900,
        );
      });
    }, 4000);
  </script>
</body>
</html>
