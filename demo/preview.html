<!DOCTYPE html>
<html lang="zh-CN" data-ydm-preview="true">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="require-trusted-types-for 'script'">
  <title>YouTube Danmaku preview</title>
  <style>
    body {
      margin: 0;
      background: #0f0f0f;
      color: #f1f1f1;
      font-family: Roboto, Arial, sans-serif;
    }
    .layout {
      display: flex;
      gap: 16px;
      padding: 68px 16px 16px;
      align-items: flex-start;
    }
    #movie_player {
      position: relative;
      width: 640px;
      height: 360px;
      background: #000;
    }
    .page-header,
    .video-title {
      position: relative;
      z-index: 20;
      background: #0f0f0f;
    }
    .page-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 56px;
      z-index: 2000;
    }
    .html5-video-container {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      background: #111;
      object-fit: cover;
    }
    .ytp-chrome-bottom {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 48px;
      z-index: 40;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.75));
    }
    .ytp-right-controls {
      position: absolute;
      right: 0;
      top: 0;
      height: 48px;
      display: flex;
      align-items: center;
    }
    ytd-live-chat-frame {
      width: 320px;
      height: 596px;
      background: #181818;
      display: flex;
      flex-direction: column;
    }
    yt-live-chat-header-renderer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      min-height: 48px;
      padding: 0 8px;
      border-bottom: 1px solid #303030;
      flex-shrink: 0;
    }
    #close-button {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: #aaa;
      cursor: pointer;
    }
    #picker-buttons {
      display: flex;
      align-items: center;
      gap: 4px;
      margin: 0 8px;
      min-height: 40px;
    }
    #items {
      flex: 1;
      overflow: auto;
      padding: 8px;
      font-size: 13px;
    }
    #items yt-live-chat-text-message-renderer,
    #items yt-live-chat-paid-message-renderer {
      display: block;
      margin: 6px 0;
    }
    yt-live-chat-paid-message-renderer {
      border-radius: 8px;
      overflow: hidden;
    }
    yt-live-chat-paid-message-renderer #header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      background: #d32f2f;
      color: #fff;
    }
    yt-live-chat-paid-message-renderer #content {
      padding: 6px 8px 8px;
      background: #b71c1c;
      color: #fff;
    }
    yt-live-chat-paid-message-renderer #author-photo img {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: block;
    }
    #author-name { font-weight: 600; margin-right: 6px; }
    #purchase-amount { font-weight: 700; margin-left: auto; }
    #input {
      margin: 8px;
      min-height: 36px;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 6px 8px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 8px 8px;
    }
    .speech-hint {
      margin: 0 8px 8px;
      color: #aaa;
      font-size: 12px;
      line-height: 1.45;
    }
    button {
      background: #272727;
      color: #fff;
      border: none;
      border-radius: 16px;
      padding: 8px 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="page-header"></div>
  <div class="layout">
    <ytd-watch-flexy class="ytd-page-manager">
      <div id="movie_player" class="html5-video-player">
        <div class="html5-video-container">
          <video class="video-stream html5-main-video"></video>
        </div>
        <div class="ytp-chrome-bottom">
          <div class="ytp-right-controls"></div>
        </div>
      </div>
    </ytd-watch-flexy>
    <ytd-live-chat-frame id="chat">
      <div id="chat-messages">
        <yt-live-chat-header-renderer>
          <button id="close-button" type="button" aria-label="Close" title="Close">×</button>
        </yt-live-chat-header-renderer>
        <div id="items" class="yt-live-chat-item-list-renderer">
          <yt-live-chat-text-message-renderer id="history-1">
            <span id="author-name" style="color:#aaaaaa">History</span>
            <span id="message">already on screen</span>
          </yt-live-chat-text-message-renderer>
        </div>
      </div>
      <div id="picker-buttons"></div>
      <div id="input" class="yt-live-chat-text-input-field-renderer" contenteditable="true"></div>
      <div class="toolbar">
        <button id="add-chat" type="button">Add chat</button>
        <button id="add-superchat" type="button">Add Super Chat</button>
        <button id="add-member" type="button">Add Member</button>
      </div>
      <p class="speech-hint">右键聊天可翻译 / 朗读 / 发弹幕 / 收藏 / 打开主页；点击 Super Chat / Member 也可操作。标题栏可清空或收起聊天；收起后可用侧边或控制栏展开。星标可收藏句子。设置里可开启 Super Chat 悬停：选位置（顶/角/底）、精简模式（头像+用户名+金额，点击查看详情）、滚动区域（含下半屏）、最多十条、跟随 YouTube ticker 时间、是否遮挡滚动弹幕。朗读按钮打开面板；音量为 0 时图标变为静音。</p>
    </ytd-live-chat-frame>
  </div>
  <script>
    function GM_addStyle(css) {
      const style = document.createElement('style');
      style.textContent = css;
      document.documentElement.appendChild(style);
    }
    function GM_getValue(key, fallback) {
      try {
        const raw = localStorage.getItem('ydm-preview:' + key);
        return raw == null ? fallback : JSON.parse(raw);
      } catch (_) {
        return fallback;
      }
    }
    function GM_setValue(key, value) {
      localStorage.setItem('ydm-preview:' + key, JSON.stringify(value));
    }
    function GM_xmlhttpRequest(details) {
      if (details && typeof details.onerror === 'function') details.onerror({});
    }
    function GM_setClipboard(text) {
      if (navigator.clipboard) return navigator.clipboard.writeText(text);
    }
  </script>
  <script src="../dist/youtube-danmaku.user.js?v=165"></script>
  <script>
    const samples = [
      ['Alice', '#ff8a80', 'hello from chat'],
      ['小明', '#ffd600', '这是一条中文弹幕'],
      ['Bob', '#82b1ff', 'lol lol lol lol lol'],
      ['重复', '#ea80fc', '我不知道我不知道我不知道我不知道我不知道'],
      ['数字', '#b9f6ca', '666'],
      ['表情', '#ffab91', '😂😂😂'],
      ['长句', '#80d8ff', '这是一条比较长的弹幕，用来试听变速模式会不会在超过单条最长朗读时间之后自动加快语速。'],
    ];
    const scSamples = [
      ['SuperFan', '$5.00', '#e53935', 'thanks for the stream'],
      ['PatronLongNameHere', '¥200', '#f9a825', '老板大气！希望下次还能看到这么有趣的直播内容，继续加油。'],
      ['Gift', '$2.00', '#1e88e5', 'hello'],
      ['NightOwl', '$10.00', '#8e24aa', 'This is a longer Super Chat so the pinned pill should scroll the message while avatar and amount stay fixed.'],
    ];
    const memberSamples = [
      ['@P猫3', 'New member', '#0f9d58', 'Welcome to しらせの楽園'],
      ['LongMemberNameHere', 'Member', '#0a8043', 'Welcome to the channel!'],
    ];
    // Allowed by the userscript emote host allowlist (ggpht).
    const avatarUrl = 'https://yt3.ggpht.com/a/default-user=s48-c-k-c0x00ffffff-no-rj';
    let seq = 0;

    function addMessage(name, color, text) {
      const item = document.createElement('yt-live-chat-text-message-renderer');
      item.id = 'live-' + (++seq);
      const author = document.createElement('span');
      author.id = 'author-name';
      author.style.color = color;
      author.textContent = name;
      const link = document.createElement('a');
      link.href = 'https://www.youtube.com/@' + encodeURIComponent(name);
      link.appendChild(author);
      const message = document.createElement('span');
      message.id = 'message';
      message.textContent = text;
      item.append(link, message);
      document.getElementById('items').appendChild(item);
    }

    function addSuperchat(name, amount, color, text) {
      const item = document.createElement('yt-live-chat-paid-message-renderer');
      item.id = 'live-sc-' + (++seq);
      const header = document.createElement('div');
      header.id = 'header';
      header.style.background = color;
      header.style.color = '#fff';
      const photo = document.createElement('yt-img-shadow');
      photo.id = 'author-photo';
      const img = document.createElement('img');
      img.src = avatarUrl;
      img.alt = '';
      photo.appendChild(img);
      const author = document.createElement('span');
      author.id = 'author-name';
      author.textContent = name;
      const purchase = document.createElement('span');
      purchase.id = 'purchase-amount';
      purchase.textContent = amount;
      header.append(photo, author, purchase);
      const content = document.createElement('div');
      content.id = 'content';
      content.style.background = color;
      content.style.color = '#fff';
      const message = document.createElement('span');
      message.id = 'message';
      message.textContent = text;
      content.appendChild(message);
      item.append(header, content);
      document.getElementById('items').appendChild(item);
    }

    document.getElementById('add-chat').addEventListener('click', () => {
      const sample = samples[seq % samples.length];
      addMessage(sample[0], sample[1], sample[2] + ' ' + (seq + 1));
    });

    function addMember(name, badge, color, welcome) {
      const item = document.createElement('yt-live-chat-membership-item-renderer');
      item.id = 'live-member-' + (++seq);
      const card = document.createElement('div');
      card.id = 'card';
      const header = document.createElement('div');
      header.id = 'header';
      header.style.background = color;
      header.style.color = '#fff';
      const photo = document.createElement('yt-img-shadow');
      photo.id = 'author-photo';
      const img = document.createElement('img');
      img.src = avatarUrl;
      img.alt = '';
      photo.appendChild(img);
      const author = document.createElement('span');
      author.id = 'author-name';
      author.textContent = name;
      const badgeEl = document.createElement('yt-live-chat-author-badge-renderer');
      badgeEl.setAttribute('type', 'member');
      badgeEl.setAttribute('shared-tooltip-text', badge);
      badgeEl.setAttribute('aria-label', badge);
      const sub = document.createElement('div');
      sub.id = 'header-subtext';
      sub.textContent = welcome;
      header.append(photo, author, badgeEl, sub);
      const content = document.createElement('div');
      content.id = 'content';
      content.style.background = color;
      const message = document.createElement('div');
      message.id = 'message';
      content.appendChild(message);
      card.append(header, content);
      item.appendChild(card);
      document.getElementById('items').appendChild(item);
    }

    document.getElementById('add-superchat').addEventListener('click', () => {
      const sample = scSamples[seq % scSamples.length];
      addSuperchat(sample[0], sample[1], sample[2], sample[3] + ' #' + (seq + 1));
    });

    document.getElementById('add-member').addEventListener('click', () => {
      const sample = memberSamples[seq % memberSamples.length];
      addMember(sample[0], sample[1], sample[2], sample[3] + ' #' + (seq + 1));
    });

    setTimeout(() => {
      samples.forEach((sample, index) => {
        setTimeout(() => addMessage(sample[0], sample[1], sample[2]), index * 700);
      });
      scSamples.forEach((sample, index) => {
        setTimeout(
          () => addSuperchat(sample[0], sample[1], sample[2], sample[3]),
          samples.length * 700 + index * 900,
        );
      });
      memberSamples.forEach((sample, index) => {
        setTimeout(
          () => addMember(sample[0], sample[1], sample[2], sample[3]),
          samples.length * 700 + scSamples.length * 900 + index * 900,
        );
      });
    }, 4000);
  </script>
</body>
</html>
